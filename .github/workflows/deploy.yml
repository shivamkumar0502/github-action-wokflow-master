name: Deploy Node.js

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Check Node
        run: |
          node -v
          npm -v

      - name: Install Dependencies
        run: npm install

      - name: Run Tests
        run: npm test

      - name: Deploy Application
        run: |
          mkdir -p /home/ubuntu/node-demo
          cp server.js package.json package-lock.json /home/ubuntu/node-demo/

          cd /home/ubuntu/node-demo

          npm install --omit=dev

          if [ -f app.pid ]; then
            PID=$(cat app.pid)
            if kill -0 "$PID" 2>/dev/null; then
              kill "$PID"
              sleep 2
            fi
          fi

          nohup node server.js > app.log 2>&1 &
          echo $! > app.pid

      - name: Verify Deployment
        run: |
          sleep 5
          curl --fail http://localhost:8080/hello